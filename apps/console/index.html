<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>howUdeyChat — Staff Console</title>
<style>
:root {
  --bg: #0f1419; --panel: #1a2230; --panel2: #222d3d; --line: #2e3b4e;
  --text: #e8eef5; --dim: #8fa1b5; --accent: #2f9e6e; --accent2: #1f7a52;
  --warn: #d9a03b; --danger: #d9534f;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; font-weight: 600; }
header .who { margin-left: auto; color: var(--dim); font-size: 13px; }
.badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
.badge.doctor { background: #1d3a5f; color: #7fb3e8; }
.badge.nurse { background: #14352a; color: #6fd3a7; }
.badge.chw { background: #3d3416; color: #e3c06a; }
.badge.admin { background: #3a1d1d; color: #e88a8a; }
main { flex: 1; display: flex; min-height: 0; }
#queue { width: 300px; border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
#queue h2 { padding: 12px 14px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
.qitem { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.qitem:hover { background: var(--panel2); }
.qitem.sel { background: var(--panel2); border-left: 3px solid var(--accent); }
.qitem .patient { font-weight: 600; }
.qitem .reason { color: var(--dim); font-size: 13px; }
.qitem .status { font-size: 11px; color: var(--warn); text-transform: uppercase; }
.qitem .status.claimed { color: var(--accent); }
.empty { padding: 24px 14px; color: var(--dim); font-size: 13px; text-align: center; }
#thread { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; background: var(--panel2); }
.msg.mine { align-self: flex-end; background: var(--accent2); }
.msg .who { font-size: 11px; color: var(--dim); margin-bottom: 2px; }
.msg.mine .who { color: #bfe6d3; }
.msg .sys { color: var(--warn); font-size: 13px; }
#composer { display: flex; gap: 8px; padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--line); }
#composer input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
button.sec { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
button:disabled { opacity: .4; cursor: default; }
#threadbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
#threadbar .title { font-weight: 600; }
#threadbar .spacer { flex: 1; }
#login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 10; }
#login form { background: var(--panel); padding: 28px; border-radius: 14px; border: 1px solid var(--line); width: 340px; display: flex; flex-direction: column; gap: 12px; }
#login h1 { font-size: 18px; }
#login input { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
#login .err { color: var(--danger); font-size: 13px; min-height: 18px; }
#login .hint { color: var(--dim); font-size: 12px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="login">
  <form id="loginform">
    <h1>Staff Console</h1>
    <input id="hs" placeholder="Homeserver" value="http://127.0.0.1:8008">
    <input id="user" placeholder="Username (e.g. mdcn-4521)">
    <input id="pass" type="password" placeholder="PIN">
    <input id="admin" placeholder="Admin service URL" value="http://127.0.0.1:8100">
    <input id="token" type="password" placeholder="Console access token">
    <div class="err" id="loginerr"></div>
    <button type="submit">Sign in</button>
    <div class="hint">Staff accounts are provisioned by your clinic admin. The console token is issued to the facility, not to individuals.</div>
  </form>
</div>

<header hidden id="hdr">
  <h1>howUdeyChat Staff Console</h1>
  <span class="badge" id="rolebadge"></span>
  <span class="who" id="who"></span>
</header>
<main hidden id="main">
  <section id="queue">
    <h2>Waiting patients</h2>
    <div id="qlist"></div>
  </section>
  <section id="thread">
    <div id="threadbar">
      <span class="title" id="threadtitle">Select a patient</span>
      <span class="spacer"></span>
      <button class="sec" id="btn-call" disabled>📞 Voice</button>
      <button class="sec" id="btn-video" disabled>🎥 Video</button>
      <button class="sec" id="btn-resolve" disabled>Resolve</button>
    </div>
    <div id="msgs"><div class="empty">Escalations from patients and the triage bot appear on the left. Claim one to open the room.</div></div>
    <form id="composer" hidden>
      <input id="text" placeholder="Message the patient…" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>
</main>

<script type="module" src="js/console.js"></script>
</body>
</html>
